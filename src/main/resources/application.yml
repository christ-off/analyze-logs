spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:sqlite:${app.db-path:logs.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA journal_mode=WAL"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  thymeleaf:
    cache: false
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

app:
  aws:
    region: eu-west-3
    bucket: ""
    prefix: ""
  db-path: logs.db
  top-limit: 10
  top-detail-limit: 20
  top-urls-limit: 20
  top-referers-limit: 20
  nb-months-to-keep: 3
  robots-url: "https://post-tenebras-lire.net/robots.txt"

referer-filter:
  self-referers: []

uri-stem-groups:
  groups:
    - name: "PHP/WordPress"
      security: true
      patterns:
        - "/wp-%"
        - "//wp-%"
        - "/wordpress/%"
        - "/wp/%"
        - "%.php"
        - "%.php7"
        - "%/admin%"
        - "%/administrator%"
        - "%/manager/html%"
        - "%/console%"
        - "%phpmyadmin%"
    - name: "Env/credential file probing"
      security: true
      patterns:
        - "%.env%"
        - "%/.git%"
        - "%/.svn%"
        - "%/.aws%"
        - "%/.vscode%"
        - "%/.ssh%"
        - "%/.docker%"
        - "%/.npmrc%"
    - name: "Config/backup dump probing"
      security: true
      patterns:
        - "%.sql"
        - "%.bak"
        - "%.zip"
        - "%.tar.gz"
        - "%.tar"
        - "%backup%"
        - "%.old"
        - "%config.json%"
        - "%.yml"
        - "%.ini"
    - name: "Open-proxy / IP-echo probing"
      security: true
      patterns:
        - "/ip"
    - name: "Java/Spring exploit probing"
      security: true
      patterns:
        - "%/actuator%"
        - "%struts%"
        - "%jndi%"
        - "%/s2-%"
        - "%.action"
    - name: "CGI-bin / router-IoT probing"
      security: true
      patterns:
        - "%/cgi-bin%"
        - "%/boaform%"
        - "%/goform%"
        - "%setup.cgi%"
    - name: "Feeds"
      patterns:
        - "/feed.xml"
        - "/rss.xml"

uri-stem-filter:
  excluded-extensions:
    - .css
    - .js
    - .svg
    - .avif
    - .ico
    - .png
    - .jpg
    - .jpeg
    - .webp
    - .gif

