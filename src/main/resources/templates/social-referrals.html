<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Social Referrals', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>Social Referrals</title></head>
<th:block class="extra-head">
    <meta name="cf-from"      th:content="${from}"/>
    <meta name="cf-to"        th:content="${to}"/>
    <meta name="cf-to-date"   th:content="${toDate}"/>
</th:block>
<th:block class="page-content">

    <!-- Flash messages -->
    <div th:replace="~{fragments/flash :: messages}"></div>

    <th:block th:replace="~{fragments/toolbar :: toolbar('/social-referrals')}"></th:block>

    <div id="socialReferralsSections">
        <div class="card mb-4" th:each="network : ${ {'WhatsApp','Facebook','Discord','Twitter/X'} }">
            <div class="card-header fw-semibold" th:text="${network}"></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Date / Time (UTC)</th>
                                <th>User Agent</th>
                                <th>URI</th>
                                <th>Country</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody th:id="'sr-' + ${#strings.replace(network, '/', '')}" class="text-muted">
                            <tr><td colspan="5" class="text-center py-3">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/social-referrals.js}"></script>
</th:block>
</html>
