<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Dashboard Rows</title></head>
<body>
<!-- Shared by dashboard.html and human.html: Top User Agents/Countries, then Top URLs/Referers.
     Chart canvases (chartUaNames, chartCountries, chartTopUrls, chartReferers) are populated by
     dashboard-charts.js's loadCoreCharts(), which each page's own script calls with its own
     endpoint prefix. -->
<th:block th:fragment="topRows">
    <div class="row g-4 mb-4">
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top User Agents</div>
                <div class="card-body"><canvas id="chartUaNames"></canvas></div>
            </div>
        </div>
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top Countries</div>
                <div class="card-body"><canvas id="chartCountries"></canvas></div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top URLs</div>
                <div class="card-body" style="position:relative;height:420px">
                    <canvas id="chartTopUrls"></canvas>
                </div>
            </div>
        </div>
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top Referers</div>
                <div class="card-body" style="position:relative;height:420px"><canvas id="chartReferers"></canvas></div>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="requestsPerDayRow">
    <div class="row g-4 mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header fw-semibold">Requests per Day</div>
                <div class="card-body"><canvas id="chartRequestsPerDay"></canvas></div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
