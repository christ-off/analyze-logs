<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('IP Requests', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>IP Requests</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
</th:block>
<th:block class="page-content">

    <div class="card mb-4">
        <div class="card-body">
            <div class="cf-detail-title">IP Requests</div>
            <code class="text-break" th:text="${ip}"></code>
            <div id="ipInfo" class="text-muted small font-monospace mt-1" th:data-ip="${ip}">Resolving&hellip;</div>
        </div>
    </div>

    <th:block th:replace="~{fragments/toolbar :: toolbarWith('/ip-requests', 'ip', ${ip})}"></th:block>

    <div class="card mb-4">
        <div class="card-header fw-semibold">
            <span>All Requests</span>
            <span class="text-muted fw-normal small" th:text="'(' + ${#lists.size(requests)} + ' rows)'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Date / Time (UTC)</th>
                        <th>IP</th>
                        <th>Name</th>
                        <th>Country</th>
                        <th>User Agent</th>
                        <th>URI</th>
                        <th>Result</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="8" class="text-center text-muted py-3">No requests found for this IP in the selected date range.</td>
                    </tr>
                    <tr th:each="req : ${requests}">
                        <td th:text="${#temporals.format(req.timestamp(), 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td th:text="${req.clientIp()}"></td>
                        <td th:text="${req.name()}"></td>
                        <td th:text="${req.country()}"></td>
                        <td class="text-break"><code th:text="${req.userAgent()}"></code></td>
                        <td><code th:text="${req.uriStem()}"></code></td>
                        <td>
                            <span th:text="${req.resultType()}"
                                  th:classappend="${req.resultType() == 'Hit'}      ? ' text-success'   :
                                                  (${req.resultType() == 'Miss'}     ? ' text-primary'   :
                                                  (${req.resultType() == 'Filtered'} ? ' text-warning'   :
                                                                                       ' text-danger'))"></span>
                        </td>
                        <td>
                            <span th:text="${req.scStatus()}"
                                  th:classappend="${req.scStatus() >= 200 and req.scStatus() < 300} ? ' text-success' :
                                                  (${req.scStatus() >= 300 and req.scStatus() < 400} ? ' text-primary' :
                                                  (${req.scStatus() >= 400 and req.scStatus() < 500} ? ' text-warning' :
                                                                                                       ' text-danger'))"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</th:block>
<th:block class="page-script">
<script type="module" th:src="@{/js/pages/ip-requests.js}"></script>
</th:block>
</html>
