<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Chrome', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>Chrome</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
</th:block>
<th:block class="page-content">

    <!-- Date range bar -->
    <div class="card mb-4 cf-toolbar">
        <div class="card-body d-flex flex-wrap align-items-center gap-2">
            <span class="fw-semibold me-2">Range:</span>
            <a th:href="@{/chrome(range='1d')}"  th:classappend="${activeRange == '1d'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">Today</a>
            <a th:href="@{/chrome(range='7d')}"  th:classappend="${activeRange == '7d'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">7 days</a>
            <a th:href="@{/chrome(range='30d')}" th:classappend="${activeRange == '30d'} ? ' active' : ''" class="btn btn-sm btn-outline-secondary">30 days</a>
            <a th:href="@{/chrome(range='3m')}"  th:classappend="${activeRange == '3m'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">3 months</a>

            <form th:action="@{/chrome}" method="get" class="d-flex align-items-center gap-2 ms-2">
                <label for="fromDate" class="form-label mb-0 fw-semibold">Custom:</label>
                <input type="date" id="fromDate" name="from" class="form-control form-control-sm" th:value="${fromDate}" style="width:150px"/>
                <span>&ndash;</span>
                <label for="toDate" class="visually-hidden">To date</label>
                <input type="date" id="toDate" name="to"   class="form-control form-control-sm" th:value="${toDate}"   style="width:150px"/>
                <button type="submit" class="btn btn-sm btn-primary">Apply</button>
            </form>

        </div>
    </div>

    <div id="minChromeVersionBanner" class="alert alert-warning d-none mb-3" role="alert"></div>

    <!-- Chrome version list — every Chrome ua_name variant, whatever the OS, grouped by major version -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">Chrome Versions</div>
        <div class="card-body p-0">
            <table class="table table-sm table-striped table-hover mb-0" id="tableVersions">
                <thead>
                    <tr>
                        <th style="width:2rem">#</th>
                        <th class="cf-sortable" data-sort-key="version">Chrome Version <span class="cf-sort-indicator"></span></th>
                        <th class="text-end cf-sortable" data-sort-key="requests" style="width:6rem">Requests <span class="cf-sort-indicator"></span></th>
                        <th class="text-end cf-sortable" data-sort-key="human" style="width:10rem">Proportion of requests from human IPs <span class="cf-sort-indicator"></span></th>
                        <th style="width:180px"></th>
                    </tr>
                </thead>
                <tbody id="tbodyVersions">
                    <tr><td colspan="5" class="text-center text-muted py-3">Loading…</td></tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/result-legend :: legend('versionBarLegend')}"></div>
    </div>

    <th:block th:replace="~{fragments/chart-rows :: chartRows}"></th:block>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/chrome.js}"></script>
</th:block>
</html>
