<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Chrome', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>Chrome</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
</th:block>
<th:block class="page-content">

    <!-- Date range bar -->
    <div class="card mb-4 cf-toolbar">
        <div class="card-body d-flex flex-wrap align-items-center gap-2">
            <span class="fw-semibold me-2">Range:</span>
            <a th:href="@{/chrome(range='1d')}"  th:classappend="${activeRange == '1d'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">Today</a>
            <a th:href="@{/chrome(range='7d')}"  th:classappend="${activeRange == '7d'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">7 days</a>
            <a th:href="@{/chrome(range='30d')}" th:classappend="${activeRange == '30d'} ? ' active' : ''" class="btn btn-sm btn-outline-secondary">30 days</a>
            <a th:href="@{/chrome(range='3m')}"  th:classappend="${activeRange == '3m'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">3 months</a>

            <form th:action="@{/chrome}" method="get" class="d-flex align-items-center gap-2 ms-2">
                <label for="fromDate" class="form-label mb-0 fw-semibold">Custom:</label>
                <input type="date" id="fromDate" name="from" class="form-control form-control-sm" th:value="${fromDate}" style="width:150px"/>
                <span>&ndash;</span>
                <label for="toDate" class="visually-hidden">To date</label>
                <input type="date" id="toDate" name="to"   class="form-control form-control-sm" th:value="${toDate}"   style="width:150px"/>
                <button type="submit" class="btn btn-sm btn-primary">Apply</button>
            </form>

            <!-- Bot filter toggle -->
            <div class="form-check form-switch ms-3 d-flex align-items-center gap-2">
                <input class="form-check-input" type="checkbox" role="switch" aria-checked="false"
                       id="toggleBots" style="width:2.5em; height:1.5em"/>
                <label class="form-check-label fw-semibold" for="toggleBots">Hide bots, apps &amp; feeds &amp; noise</label>
            </div>
        </div>
    </div>

    <div id="minChromeVersionBanner" class="alert alert-warning d-none mb-3" role="alert"></div>

    <!-- Chrome version list — every Chrome ua_name variant, whatever the OS, grouped by major version -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">Chrome Versions</div>
        <div class="card-body p-0">
            <table class="table table-sm table-striped table-hover mb-0" id="tableVersions">
                <thead>
                    <tr>
                        <th style="width:2rem">#</th>
                        <th>Chrome Version</th>
                        <th class="text-end" style="width:6rem">Requests</th>
                        <th class="text-end" style="width:10rem">Proportion of requests from human IPs</th>
                        <th style="width:180px"></th>
                    </tr>
                </thead>
                <tbody id="tbodyVersions">
                    <tr><td colspan="5" class="text-center text-muted py-3">Loading…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex gap-3 flex-wrap py-2" id="versionBarLegend" style="display:none!important">
            <span class="d-flex align-items-center gap-1 small"><span style="width:12px;height:12px;border-radius:2px;background:rgba(40,167,69,0.8);display:inline-block"></span>Hit</span>
            <span class="d-flex align-items-center gap-1 small"><span style="width:12px;height:12px;border-radius:2px;background:rgba(54,162,235,0.8);display:inline-block"></span>Miss</span>
            <span class="d-flex align-items-center gap-1 small"><span style="width:12px;height:12px;border-radius:2px;background:rgba(253,126,20,0.8);display:inline-block"></span>Filtered</span>
            <span class="d-flex align-items-center gap-1 small"><span style="width:12px;height:12px;border-radius:2px;background:rgba(220,53,69,0.8);display:inline-block"></span>Error</span>
        </div>
    </div>

    <!-- row 1: result types, countries, top URLs -->
    <div class="row g-4 mb-4">
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header fw-semibold">Result Types</div>
                <div class="card-body"><canvas id="chartResultTypes"></canvas></div>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header fw-semibold">Countries</div>
                <div class="card-body"><canvas id="chartCountries"></canvas></div>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top URLs</div>
                <div class="card-body"><canvas id="chartUriStems"></canvas></div>
            </div>
        </div>
    </div>

    <!-- row 2: requests per day line chart -->
    <div class="row g-4 mb-4">
        <div class="col-xl-12">
            <div class="card h-100">
                <div class="card-header fw-semibold">Requests per Day</div>
                <div class="card-body"><canvas id="chartRequestsPerDay"></canvas></div>
            </div>
        </div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/chrome.js}"></script>
</th:block>
</html>
