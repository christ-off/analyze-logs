<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('UA Requests', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>UA Requests</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
    <meta name="cf-ua"   th:content="${ua}"/>
</th:block>
<th:block class="page-content">

    <!-- Header + date range bar -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex align-items-center gap-3">
                <div>
                    <div class="cf-detail-title">UA Requests</div>
                    <code class="text-break" th:text="${ua}"></code>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/toolbar :: toolbarWith('/ua-requests', 'ua', ${ua})}"></th:block>

    <!-- Human traffic indicator -->
    <div class="card mb-4">
        <div class="card-body d-flex align-items-center gap-2">
            <span class="fw-semibold">Proportion of requests from human IPs:</span>
            <span th:text="${#numbers.formatDecimal(humanTrafficStats.percentage(), 1, 1)} + '%'"></span>
            <span class="text-muted small"
                  th:text="'(' + ${humanTrafficStats.humanRequests()} + ' / ' + ${humanTrafficStats.totalRequests()} + ' requests)'"></span>
        </div>
    </div>

    <!-- Requests per day line chart -->
    <div class="row g-4 mb-4">
        <div class="col-xl-12">
            <div class="card h-100">
                <div class="card-header fw-semibold">Requests per Day</div>
                <div class="card-body"><canvas id="chartRequestsPerDay"></canvas></div>
            </div>
        </div>
    </div>

    <!-- Requests table -->
    <div class="card mb-4">
        <div class="card-header fw-semibold d-flex align-items-center flex-wrap gap-2">
            <span>All Requests</span>
            <span class="text-muted fw-normal small" th:text="'(' + ${#lists.size(requests)} + ' rows)'"></span>
            <button type="button" id="bulkReportBtn" class="btn btn-sm btn-outline-danger ms-auto d-none">Report selected</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th th:if="${not #lists.isEmpty(requests)}"><input type="checkbox" id="selectAllRows" class="form-check-input" aria-label="Select all rows"/></th>
                        <th>Date / Time (UTC)</th>
                        <th>IP</th>
                        <th>Country</th>
                        <th>URI</th>
                        <th>Result</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="7" class="text-center text-muted py-3">No requests found for this user agent in the selected date range.</td>
                    </tr>
                    <tr th:each="req : ${requests}"
                        th:data-timestamp="${req.timestamp()}"
                        th:data-uri="${req.uriStem()}"
                        th:data-result="${req.resultType()}"
                        th:data-status="${req.scStatus()}"
                        th:data-country="${req.country()}">
                        <td><input type="checkbox" class="form-check-input row-select" aria-label="Select row"/></td>
                        <td th:text="${#temporals.format(req.timestamp(), 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td class="ip-cell" th:data-ip="${req.clientIp()}" th:text="${req.clientIp()}"></td>
                        <td th:text="${req.country()}"></td>
                        <td><code th:text="${req.uriStem()}"></code></td>
                        <td>
                            <span th:text="${req.resultType()}"
                                  th:classappend="${req.resultType() == 'Hit'}      ? ' text-success'   :
                                                  (${req.resultType() == 'Miss'}     ? ' text-primary'   :
                                                  (${req.resultType() == 'Filtered'} ? ' text-warning'   :
                                                                                       ' text-danger'))">
                            </span>
                        </td>
                        <td>
                            <span th:text="${req.scStatus()}"
                                  th:classappend="${req.scStatus() >= 200 and req.scStatus() < 300} ? ' text-success' :
                                                  (${req.scStatus() >= 300 and req.scStatus() < 400} ? ' text-primary' :
                                                  (${req.scStatus() >= 400 and req.scStatus() < 500} ? ' text-warning' :
                                                                                                       ' text-danger'))">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</th:block>
<th:block class="page-script">
<script type="module" th:src="@{/js/pages/ua-requests.js}"></script>
</th:block>
</html>
