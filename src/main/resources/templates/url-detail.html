<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('URL Detail – ' + ${urlName}, ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title th:text="'URL Detail – ' + ${urlName}">URL Detail</title></head>
<th:block class="extra-head">
    <meta name="cf-from"  th:content="${from}"/>
    <meta name="cf-to"    th:content="${to}"/>
    <meta name="cf-url"   th:content="${urlName}"/>
</th:block>
<th:block class="page-content">

    <th:block th:replace="~{fragments/toolbar :: detailToolbar('/url-detail', 'url', ${urlName}, ${urlName})}"></th:block>

    <!-- matching URI stems list -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">URLs</div>
        <div class="card-body p-0">
            <table class="table table-sm table-striped table-hover mb-0" id="tableUrls">
                <thead>
                    <tr>
                        <th style="width:2rem">#</th>
                        <th>URI Stem</th>
                        <th class="text-end" style="width:7rem">Requests</th>
                        <th style="width:200px">Hit / Miss / Filtered / Error</th>
                    </tr>
                </thead>
                <tbody id="tbodyUrls">
                    <tr><td colspan="4" class="text-center text-muted py-3">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- row 1: Top Countries + Top User Agents -->
    <div class="row g-4 mb-4">
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top Countries</div>
                <div class="card-body"><canvas id="chartCountries"></canvas></div>
            </div>
        </div>
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top User Agents</div>
                <div class="card-body"><canvas id="chartUserAgents"></canvas></div>
            </div>
        </div>
    </div>

    <!-- row 2: Requests per Day -->
    <div class="row g-4 mb-4">
        <div class="col-xl-12">
            <div class="card h-100">
                <div class="card-header fw-semibold">Requests per Day</div>
                <div class="card-body"><canvas id="chartRequestsPerDay"></canvas></div>
            </div>
        </div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/url-detail.js}"></script>
</th:block>
</html>
