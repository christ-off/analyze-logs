<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('CloudFront Dashboard', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>CloudFront Dashboard</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
</th:block>
<th:block class="page-content">

    <!-- Flash messages -->
    <div th:replace="~{fragments/flash :: messages}"></div>

    <th:block th:replace="~{fragments/toolbar :: toolbar('/')}"></th:block>

    <th:block th:replace="~{fragments/dashboard-rows :: topRows}"></th:block>

    <!-- Charts row 3: UA groups pie + Platforms pie -->
    <div class="row g-4 mb-4">
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">User Agent Groups</div>
                <div class="card-body" style="position:relative;height:340px">
                    <canvas id="chartUaGroups"></canvas>
                </div>
            </div>
        </div>
        <div class="col-xl-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Platforms</div>
                <div class="card-body" style="position:relative;height:340px">
                    <canvas id="chartPlatforms"></canvas>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/dashboard-rows :: requestsPerDayRow}"></th:block>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/dashboard.js}"></script>
</th:block>
</html>
