<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Country Detail – ' + ${countryName}, ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title th:text="'Country Detail – ' + ${countryName}">Country Detail</title></head>
<th:block class="extra-head">
    <meta name="cf-from"      th:content="${from}"/>
    <meta name="cf-to"        th:content="${to}"/>
    <meta name="cf-country"   th:content="${countryCode}"/>
</th:block>
<th:block class="page-content">

    <th:block th:replace="~{fragments/toolbar :: detailToolbar('/country-detail', 'country', ${countryCode}, ${countryName})}"></th:block>

    <!-- Information -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">Information</div>
        <div class="card-body">
            <div class="d-flex align-items-center gap-2">
                <span class="fw-semibold">Proportion of requests from human IPs:</span>
                <span th:text="${#numbers.formatDecimal(humanTrafficStats.percentage(), 1, 1)} + '%'"></span>
                <span class="text-muted small"
                      th:text="'(' + ${humanTrafficStats.humanRequests()} + ' / ' + ${humanTrafficStats.totalRequests()} + ' requests)'"></span>
            </div>
            <div><span class="fw-semibold">Mastodon requests:</span> <span th:text="${clientCounts.mastodon()}"></span></div>
            <div><span class="fw-semibold">Search bot requests:</span> <span th:text="${clientCounts.searchBots()}"></span></div>
            <div><span class="fw-semibold">Feed requests:</span> <span th:text="${clientCounts.feeds()}"></span></div>
        </div>
    </div>

    <!-- row 0: top URLs (full width, fixed height for readable labels) -->
    <div class="row g-4 mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header fw-semibold">Top URLs</div>
                <div class="card-body" style="position:relative;height:420px">
                    <canvas id="chartUriStems"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- row 1: top user agents (wide) + result types pie (narrow) -->
    <div class="row g-4 mb-4">
        <div class="col-xl-8">
            <div class="card h-100">
                <div class="card-header fw-semibold">Top User Agents</div>
                <div class="card-body"><canvas id="chartUaNames"></canvas></div>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="card h-100">
                <div class="card-header fw-semibold">Result Types</div>
                <div class="card-body d-flex align-items-center justify-content-center" style="position:relative;height:280px">
                    <canvas id="chartResultTypes"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- row 2: requests per day (full width) -->
    <div class="row g-4 mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header fw-semibold">Requests per Day</div>
                <div class="card-body"><canvas id="chartRequestsPerDay"></canvas></div>
            </div>
        </div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/country-detail.js}"></script>
</th:block>
</html>
