<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Bene Tleilax', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>Bene Tleilax</title></head>
<th:block class="extra-head">
    <meta name="cf-from"      th:content="${from}"/>
    <meta name="cf-to"        th:content="${to}"/>
    <meta name="cf-to-date"   th:content="${toDate}"/>
</th:block>
<th:block class="page-content">

    <!-- Flash messages -->
    <div th:replace="~{fragments/flash :: messages}"></div>

    <!-- Date range bar -->
    <div class="card mb-4 cf-toolbar">
        <div class="card-body d-flex flex-wrap align-items-center gap-2">
            <span class="fw-semibold me-2">Range:</span>
            <a th:href="@{/bene-tleilax?range=1d}"  th:classappend="${activeRange == '1d'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">Today</a>
            <a th:href="@{/bene-tleilax?range=7d}"  th:classappend="${activeRange == '7d'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">7 days</a>
            <a th:href="@{/bene-tleilax?range=30d}" th:classappend="${activeRange == '30d'} ? ' active' : ''" class="btn btn-sm btn-outline-secondary">30 days</a>
            <a th:href="@{/bene-tleilax?range=3m}"  th:classappend="${activeRange == '3m'}  ? ' active' : ''" class="btn btn-sm btn-outline-secondary">3 months</a>

            <form th:action="@{/bene-tleilax}" method="get" class="d-flex align-items-center gap-2 ms-2">
                <label for="fromDate" class="form-label mb-0 fw-semibold">Custom:</label>
                <input type="date" id="fromDate" name="from" class="form-control form-control-sm" th:value="${fromDate}" style="width:150px"/>
                <label for="toDate" class="form-label mb-0 fw-semibold">&ndash;</label>
                <input type="date" id="toDate" name="to"   class="form-control form-control-sm" th:value="${toDate}"   style="width:150px"/>
                <button type="submit" class="btn btn-sm btn-primary">Apply</button>
            </form>
        </div>
    </div>

    <!-- Identity-shifting IPs -->
    <div class="card mb-4">
        <div class="card-header fw-semibold">
            Bene Tleilax
            <span class="text-muted fw-normal small ms-2">Face Dancers — one IP presenting more than one known crawler identity. Real bots never share infrastructure like this.</span>
        </div>
        <div class="card-body">
            <div id="identityShiftsList" class="text-muted text-center py-3">Loading...</div>
        </div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/bene-tleilax.js}"></script>
</th:block>
</html>
