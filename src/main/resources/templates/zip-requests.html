<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Zip Requests', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>Zip Requests</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
</th:block>
<th:block class="page-content">

    <!-- Flash messages -->
    <div th:replace="~{fragments/flash :: messages}"></div>

    <th:block th:replace="~{fragments/toolbar :: toolbar('/zip-requests')}"></th:block>

    <!-- Requests table -->
    <div class="card mb-4">
        <div class="card-header fw-semibold d-flex align-items-center flex-wrap gap-2">
            <span>Zip / Archive Requests</span>
            <span id="zipRequestsCount" class="text-muted fw-normal small">(sorted by count)</span>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>URI</th>
                        <th class="text-end">Count</th>
                        <th style="width:35%">Hit / Miss / Filtered / Error</th>
                    </tr>
                </thead>
                <tbody id="zipRequestsTable">
                    <tr><td colspan="3" class="text-center text-muted py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/result-legend :: legend('zipRequestsLegend')}"></div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/pages/zip-requests.js}"></script>
</th:block>
</html>
