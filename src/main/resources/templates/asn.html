<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('ASN', ~{:: .extra-head}, ~{:: .page-content}, ~{:: .page-script})}">
<head><title>ASN</title></head>
<th:block class="extra-head">
    <meta name="cf-from" th:content="${from}"/>
    <meta name="cf-to"   th:content="${to}"/>
</th:block>
<th:block class="page-content">

    <div th:replace="~{fragments/flash :: messages}"></div>

    <th:block th:replace="~{fragments/toolbar :: toolbar('/asn')}"></th:block>

    <div class="card mb-4">
        <div class="card-header fw-semibold d-flex align-items-center flex-wrap gap-2">
            <span>Top ASN</span>
            <span class="text-muted fw-normal small">(only logs delivered with the asn field, since 2026-11-11)</span>
            <span class="ms-auto d-flex align-items-center gap-2 fw-normal small">
                <span id="asnNamesStatus" class="text-muted">Names not loaded? Download them once.</span>
                <button type="button" id="asnNamesBtn" class="btn btn-sm btn-outline-secondary">Download ASN names</button>
            </span>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ASN</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th class="text-end">% human</th>
                        <th class="text-end">Feed / RSS</th>
                        <th class="text-end">Requests</th>
                        <th style="width:35%">Hit / Miss / Filtered / Error</th>
                    </tr>
                </thead>
                <tbody id="asnTable">
                    <tr><td colspan="7" class="text-center text-muted py-3">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/result-legend :: legend('asnLegend')}"></div>
    </div>

</th:block>
<th:block class="page-script">
    <script type="module" th:src="@{/js/pages/asn.js}"></script>
</th:block>
</html>
